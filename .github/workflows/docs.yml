# SPDX-License-Identifier: BSD-3-Clause
name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files and relative links
        run: bash scripts/check-docs.sh
